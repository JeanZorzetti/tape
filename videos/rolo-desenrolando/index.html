<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>TapePro · rolo desenrolando</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        font-weight: 800;
        src: url("assets/fonts/archivo-latin-800-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 500;
        src: url("assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #232c7a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #232c7a;
      }
      #rolo-cena {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #texto {
        position: absolute;
        left: 88px;
        right: 88px;
        top: 190px;
      }
      .linha {
        display: block;
        font-family: "Archivo", sans-serif;
        font-weight: 800;
        font-size: 132px;
        line-height: 0.94;
        letter-spacing: -0.03em;
        color: #ffffff;
      }
      .apoio {
        display: block;
        margin-top: 52px;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-size: 30px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #f47c20;
      }
      .endereco {
        display: block;
        margin-top: 26px;
        font-family: "IBM Plex Mono", monospace;
        font-weight: 500;
        font-size: 40px;
        letter-spacing: 0.04em;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-gr2s" id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <canvas data-hf-id="hf-038d" id="rolo-cena" width="1080" height="1920" data-layout-allow-overflow></canvas>
      <div data-hf-id="hf-9x7b" id="texto" class="clip" data-start="0" data-duration="8" data-track-index="1">
        <span data-hf-id="hf-k6ws" class="linha" id="linha-1">Sua marca</span>
        <span data-hf-id="hf-qsr4" class="linha" id="linha-2">sela cada</span>
        <span data-hf-id="hf-rfbz" class="linha" id="linha-3">caixa que sai.</span>
        <span data-hf-id="hf-tbbf" class="apoio" id="apoio">A partir de 20 rolos · até 2 cores</span>
        <span data-hf-id="hf-0cys" class="endereco" id="endereco">tapeprofitas.com.br</span>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(
        ["#linha-1", "#linha-2", "#linha-3"],
        { opacity: 0, y: 48 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out", stagger: 0.14 },
        1.1,
      );
      tl.fromTo("#apoio", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.2);
      tl.fromTo("#endereco", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>

    <script type="module">
      // A mesma cena do hero do site (src/lib/rolo3d/cena.ts, empacotada em assets/cena.js),
      // num enquadramento vertical. O tempo do vídeo decide quanto de fita já saiu.
      import { criarCenaDoRolo, carregarFontesDaImpressao } from "./assets/cena.js";

      const LARGURA = 1080;
      const ALTURA = 1920;
      const ENQUADRAMENTO_VERTICAL = { campoDeVisao: 40, posicao: { x: 0.62, y: -0.55 } };
      const COMPRIMENTO_INICIAL = 0.6;
      // Uma volta do rolo = um ciclo da impressão (2π). Terminar uma volta depois do quadro
      // em que TAPEPRO cruza o meio da fita (6,4) fecha o vídeo com a marca no mesmo lugar.
      const COMPRIMENTO_FINAL = 6.4 + 2 * Math.PI;
      const INICIO_DO_PUXAO = 0.3;
      const FIM_DO_PUXAO = 7.6;

      // Arranque forte e assentada longa: a fita corre enquanto o título entra e para no fim.
      const desaceleraAoFim = (t) => 1 - Math.pow(1 - t, 3);

      function comprimentoNoTempo(tempo) {
        const progresso = Math.min(Math.max((tempo - INICIO_DO_PUXAO) / (FIM_DO_PUXAO - INICIO_DO_PUXAO), 0), 1);
        return COMPRIMENTO_INICIAL + (COMPRIMENTO_FINAL - COMPRIMENTO_INICIAL) * desaceleraAoFim(progresso);
      }

      let cena = null;
      function renderizarNoTempo(tempo) {
        if (!cena) return;
        cena.definirComprimento(comprimentoNoTempo(tempo));
        cena.renderizar();
      }

      async function montar() {
        await carregarFontesDaImpressao();
        cena = criarCenaDoRolo(document.getElementById("rolo-cena"), {
          densidadeDePixels: 1,
          preservarQuadro: true,
          enquadramento: ENQUADRAMENTO_VERTICAL,
        });
        cena.redimensionar(LARGURA, ALTURA);
        renderizarNoTempo(window.__hfThreeTime || 0);
      }

      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["rolo-3d"] = montar();
      window.addEventListener("hf-seek", (evento) => renderizarNoTempo(evento.detail.time));
    </script>
  </body>
</html>
